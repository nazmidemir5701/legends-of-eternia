directories:
  output: dist
  buildResources: build
appId: com.legendsofeternia.game
productName: LEGENDS OF ETERNIA
asar: true
files:
  - filter:
      - electron-main.js
      - server.js
      - public/**/*
      - package.json
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: LEGENDS-OF-ETERNIA-Setup-${version}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: LEGENDS OF ETERNIA
artifactName: LEGENDS-OF-ETERNIA-Setup-${version}.${ext}
electronVersion: 45.2.3
